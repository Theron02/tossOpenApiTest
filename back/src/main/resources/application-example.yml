# application-example.yml
#
# 실제 비밀값은 여기에 적지 않는다. 아래 환경변수를 셸/.env 로 주입한다.
# (.env 는 .gitignore 에 포함되어 있어야 한다)
#
# ─────────────────────────────────────────────────────────────
# 필요한 환경변수
# ─────────────────────────────────────────────────────────────
#   SUPABASE_DB_HOST      예: db.<project-ref>.supabase.co
#   SUPABASE_DB_PORT      Direct: 5432 / Transaction pooler: 6543   (기본 5432)
#   SUPABASE_DB_NAME      보통 postgres                              (기본 postgres)
#   SUPABASE_DB_USER      Direct: postgres / pooler: postgres.<project-ref>
#   SUPABASE_DB_PASSWORD  DB 비밀번호
#   JPA_DDL_AUTO          create | validate | none   (기본 validate)
#   JPA_SHOW_SQL          true | false               (기본 false)
#   DB_POOL_SIZE          HikariCP 최대 풀 크기      (기본 3)
#
#   ── 토스증권 Open API (TASK_03) ──
#   TOSS_BASE_URL         기본 https://openapi.tossinvest.com
#   TOSS_CLIENT_ID        토스 OAuth2 client_id      (비밀값)
#   TOSS_CLIENT_SECRET    토스 OAuth2 client_secret  (비밀값)
#
# 조립되는 JDBC URL:
#   jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT}/${SUPABASE_DB_NAME}
#
# ─────────────────────────────────────────────────────────────
# 접속 경로 — 둘 중 하나
# ─────────────────────────────────────────────────────────────
# 1) Direct connection (포트 5432) — 연결 테스트·DDL 검증 권장. 충돌 없음.
#    SUPABASE_DB_HOST=db.<project-ref>.supabase.co
#    SUPABASE_DB_PORT=5432
#    SUPABASE_DB_USER=postgres
#
# 2) Transaction pooler / PgBouncer (포트 6543) — 단기 연결용. transaction 모드.
#    prepareThreshold=0(application.yml에 설정됨)으로 prepared statement 충돌 방지.
#    SUPABASE_DB_HOST=aws-0-<region>.pooler.supabase.com
#    SUPABASE_DB_PORT=6543
#    SUPABASE_DB_USER=postgres.<project-ref>
spring:
  datasource:
    url: jdbc:postgresql://YOUR_HOST:5432/postgres
    username: YOUR_USER
    password: YOUR_PASSWORD