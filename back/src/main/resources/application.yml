spring:
  application:
    name: auto-trading-backend
  datasource:
    # 비밀값은 환경변수로만 주입한다. 평문 금지. (예시는 application-example.yml)
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      # 무료 티어 커넥션 한도 보호. 보수적으로 시작.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      connection-timeout: 10000
      data-source-properties:
        # PgBouncer(transaction 모드) 사용 시 서버사이드 prepared statement 충돌 방지.
        # direct connection(5432)에서는 무해, pooler(6543)에서는 필수.
        prepareThreshold: 0
  jpa:
    hibernate:
      # 연결 테스트 단계(02-A)에선 스키마를 건드리지 않는다(validate). 테이블 생성은 TASK_02 본작업.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# 토스증권 Open API (v1.1.5). 비밀값은 환경변수로만 주입한다. 평문 금지.
toss:
  base-url: ${TOSS_BASE_URL:https://openapi.tossinvest.com}
  client-id: ${TOSS_CLIENT_ID}
  client-secret: ${TOSS_CLIENT_SECRET}

# ML 예측 서비스(Python). 내부 서비스라 인증 없음. base-url 은 환경변수로 주입.
ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  connect-timeout-ms: ${ML_CONNECT_TIMEOUT_MS:1000}
  read-timeout-ms: ${ML_READ_TIMEOUT_MS:2000}
  # score(P(up)) 임계값. 전략 params 로 종목별 오버라이드 가능.
  buy-threshold: ${ML_BUY_THRESHOLD:0.6}
  sell-threshold: ${ML_SELL_THRESHOLD:0.4}

# 모든 시각 처리 기준은 Asia/Seoul (저장은 UTC)
app:
  timezone: Asia/Seoul
  # 앱↔백엔드 JWT 인증. 비밀값은 환경변수로만.
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXP_MIN:120}
  # 단일 운영자 자격증명(User 테이블 없음). password-hash는 BCrypt 해시.
  auth:
    username: ${APP_AUTH_USERNAME:operator}
    password-hash: ${APP_AUTH_PASSWORD_HASH}
