spring:
  application:
    name: auto-trading-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autotrading}
    username: ${DB_USERNAME:autotrading}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# 모든 시각 처리 기준은 Asia/Seoul (저장은 UTC)
app:
  timezone: Asia/Seoul