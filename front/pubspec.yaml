name: auto_trading
description: 자동매매 봇 모니터링·제어 앱 (Flutter, MVVM)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # 상태관리 / DI
  flutter_riverpod: ^2.5.1

  # 네트워킹
  dio: ^5.4.3+1

  # 라우팅
  go_router: ^14.2.0

  # 직렬화(불변 모델)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 보안 저장소(JWT)
  flutter_secure_storage: ^9.2.2

  # 포맷/차트
  intl: ^0.19.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 코드 생성
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0

  # 테스트
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
